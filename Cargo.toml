[package]
name = "Shidbot"
version = "0.1.0"
edition = "2024"

[dependencies]
env = "1.0.1"
poise = "0.6.2"
serde_json = "1.0"
"rand" = "0.8.5"
serde = {version = "1.0.228", features = ["derive"]}
serenity = { version = "0.12.5", features = ["full"] }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3.19"
async-std = "1.13.2"
chrono = "0.4.44"
log = "0.4.29"
simple-logging = "2.0.2"
lumelog = "0.2.0"

